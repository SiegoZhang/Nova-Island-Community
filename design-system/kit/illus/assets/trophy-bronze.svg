 <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="1.7" flood-color="#39485F" flood-opacity=".12"/></filter>
 <clipPath id="cup"><path d="M17 19Q17 16 20 16H44Q47 16 47 19V28C47 38 41 44 32 44S17 38 17 28Z"/></clipPath>
