 <linearGradient id="glass" x1="17" y1="17" x2="47" y2="43" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".82"/><stop offset=".4" stop-color="#F7FAFF" stop-opacity=".35"/><stop offset="1" stop-color="#DFE7F1" stop-opacity=".64"/></linearGradient>
 <linearGradient id="edge" x1="18" y1="15" x2="45" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".95"/><stop offset=".55" stop-color="white" stop-opacity=".6"/><stop offset="1" stop-color="#B6C2D2" stop-opacity=".45"/></linearGradient>
 <linearGradient id="handle" x1="8" y1="18" x2="53" y2="37" gradientUnits="userSpaceOnUse"><stop stop-color="#FFEBDD"/><stop offset=".45" stop-color="#F6F8FC"/><stop offset="1" stop-color="#DDA47D" stop-opacity=".65"/></linearGradient>
