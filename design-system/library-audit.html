<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>组件库完整性检查</title><style>body{font:14px/1.6 system-ui;margin:24px;background:#f7f7f9}button{padding:8px 16px}iframe{width:1000px;max-width:100%;height:800px;border:1px solid #ddd;background:white}li{margin:5px 0}.fail{color:#a23845}</style></head><body><h1>组件库完整性检查</h1><p>按组件验证样本提取、图片加载与根容器溢出。不会操作业务数据。</p><button id="run">检查全部组件</button><select id="width"><option value="1000">桌面 1000px</option><option value="390">手机 390px</option></select><p id="progress" role="status">等待开始</p><ol id="results"></ol><iframe id="audit-frame" title="当前检查组件"></iframe><script>
const button=document.querySelector('#run'),frame=document.querySelector('iframe'),results=document.querySelector('#results');let pending;
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='nova-preview'||!e.data.complete||e.data.id!==pending?.id)return;const p=pending;pending=null;clearTimeout(p.timer);p.resolve(e.data)});
button.onclick=async()=>{button.disabled=true;results.innerHTML='';frame.style.width=document.querySelector('#width').value+'px';const data=await fetch('library/catalog.json').then(r=>r.json());let count=0,errors=0;for(const c of data.components){document.querySelector('#progress').textContent=`正在检查 ${++count} / ${data.components.length}：${c.name}`;const report=await new Promise(resolve=>{const timer=setTimeout(()=>{pending=null;resolve({errors:['预览超时'],variants:0})},10000);pending={id:c.id,resolve,timer};frame.src='component-preview.html?component='+c.id+'&audit='+Date.now()});const fails=[...report.errors];if(report.variants!==c.variants.length)fails.push('状态数量不一致');if(report.overflow)fails.push('根容器横向溢出');errors+=fails.length;const li=document.createElement('li');li.dataset.component=c.id;li.dataset.errors=JSON.stringify(fails);li.className=fails.length?'fail':'pass';li.textContent=`${c.name}：${report.variants} 个样本 / ${fails.length?fails.join('；'):'通过'}`;results.append(li)}document.querySelector('#progress').textContent=`完成：${count} 个组件，${errors} 项问题`;button.disabled=false;};
</script></body></html>
