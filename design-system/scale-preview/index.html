<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>尺度对比 / Nova Island 设计系统</title>
<style>
*{box-sizing:border-box}
:root{--ink:#111;--text:#333;--muted:#626262;--line:#e4e4e8;--canvas:#f7f7f9;--surface:#fff;--blue:#0140ff;--blue-text:#0033cc;--blue-soft:#e0e8ff;--amber-bg:#fff4de;--amber-text:#845b16}
body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr;font:13px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--canvas)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:15px;font-weight:600;color:var(--ink);margin:0 8px 0 0;white-space:nowrap}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.field{display:flex;align-items:center;gap:8px}
.field>span{color:var(--muted);font-size:12px}
.segmented{display:inline-flex;background:#f2f2f4;border-radius:999px;padding:3px}
.segmented button{border:0;background:none;border-radius:999px;padding:5px 12px;min-height:30px;cursor:pointer;color:var(--muted);white-space:nowrap}
.segmented button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #09154014}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;min-height:32px;cursor:pointer}
.btn:hover{border-color:#bdcdff}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.spacer{flex:1}
main{display:grid;grid-template-columns:1fr auto;min-height:0}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 20px;min-height:0;min-width:0}
.stage.flip{grid-template-columns:1fr}
.pane{display:grid;grid-template-rows:auto 1fr;gap:8px;min-height:0;min-width:0}
.pane-label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.pane-label i{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:500;background:#f2f2f4;color:var(--muted)}
.tag.after{background:var(--blue-soft);color:var(--blue-text)}
.viewport{position:relative;overflow:hidden;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-height:0}
.viewport iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff;visibility:hidden}
.stage.flip .pane[hidden]{display:none}
.stage.flip .pane{grid-row:1;grid-column:1}
aside{width:380px;border-left:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:auto auto 1fr;min-height:0}
aside[hidden]{display:none}
aside h2{font-size:14px;margin:0;color:var(--ink)}
.aside-head{padding:16px 20px 8px}
.aside-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.summary{display:flex;flex-wrap:wrap;gap:6px;padding:4px 20px 12px;border-bottom:1px solid var(--line)}
.summary button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
.summary button[aria-pressed=true]{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue-text);font-weight:600}
.filters{display:flex;gap:8px;padding:12px 20px 0}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;flex:1;background:#fff}
.list{overflow:auto;padding:8px 20px 20px;min-height:0}
.row{padding:10px 0;border-bottom:1px solid #f0f0f2}
.row code{font:11px/1.5 ui-monospace,SFMono-Regular,monospace;color:var(--muted);overflow-wrap:anywhere}
.row .diff{display:flex;gap:6px;align-items:baseline;margin-top:3px;font:12px/1.5 ui-monospace,SFMono-Regular,monospace}
.row del{color:#a23845;text-decoration:line-through;overflow-wrap:anywhere}
.row ins{color:#276545;text-decoration:none;overflow-wrap:anywhere}
.row .file{font-size:11px;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
.note{margin:0;background:var(--amber-bg);color:var(--amber-text);font-size:12px;padding:8px 20px}
@media(max-width:900px){.stage{grid-template-columns:1fr}aside{position:fixed;inset:auto 0 0 0;width:auto;height:60vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px #09154014}}
</style>
</head>
<body>
<header>
  <h1>尺度对比<small>SCALE-PROPOSAL.md · D1–D8 已迁移</small></h1>
  <label class="field"><span>页面</span>
    <select id="page">
      <option value="#home">首页</option>
      <option value="#community">论坛</option>
      <option value="#ranking">Token 榜</option>
      <option value="#articles">文章</option>
      <option value="#courses">实战</option>
      <option value="#guide">入门指南</option>
      <option value="article.html">文章详情</option>
      
    </select>
  </label>
  <div class="field"><span>宽度</span>
    <div class="segmented" id="widths" role="group" aria-label="预览宽度">
      <button type="button" data-w="1440">1440</button><button type="button" data-w="1100">1100</button><button type="button" data-w="760">760</button><button type="button" data-w="390">390</button>
    </div>
  </div>
  <div class="field"><span>方式</span>
    <div class="segmented" id="modes" role="group" aria-label="对比方式">
      <button type="button" data-mode="side">并排</button><button type="button" data-mode="flip">切换</button>
    </div>
  </div>
  <button type="button" class="btn primary" id="flip" hidden>显示：左侧（空格切换）</button>
  <label class="field"><input type="checkbox" id="sync" checked><span>同步滚动与跳转</span></label>
  <span class="spacer"></span>
  <button type="button" class="btn" id="reload">重新加载</button>
  <button type="button" class="btn" id="toggle-list" aria-expanded="true" aria-controls="changes">变更清单</button>
</header>
<main>
  <div class="stage" id="stage">
    <section class="pane" id="pane-before"><div class="pane-label"><span class="tag">迁移前</span>2026-10-28 快照</div><div class="viewport"><iframe id="before" title="原型：迁移前"></iframe></div></section>
    <section class="pane" id="pane-after"><div class="pane-label"><span class="tag after">迁移后</span>当前原型 <i id="after-count"></i></div><div class="viewport"><iframe id="after" title="原型：迁移后"></iframe></div></section>
  </div>
  <aside id="changes">
    <div class="aside-head"><h2>变更清单</h2><p>由 <code>scripts/build-scale-preview.py</code> 按提案对照表生成。这些变更已写入原型；迁移前的 CSS 保存在 <code>scale-preview/before/</code>。</p></div>
    <div>
      <div class="summary" id="summary"></div>
      <div class="filters"><select id="file" aria-label="按文件筛选"><option value="">全部文件</option></select><input id="q" type="search" placeholder="搜索选择器或数值" aria-label="搜索变更"></div>
    </div>
    <div class="list" id="list" aria-live="polite"></div>
  </aside>
</main>
<script>
const PROTO = new URL('../../html-pages/prototype/index.html', location.href).href;
// ?before=dir/ swaps the left frame to a snapshot; ?after=dir/ swaps the right frame to a preview
// (the left frame then shows the live prototype). ?changes=file.json picks the change list.
const PARAMS = new URLSearchParams(location.search);
const dirUrl = d => d ? new URL(d, location.href).href : null;
const DIRS = {before: dirUrl(PARAMS.get('before') || (PARAMS.get('after') ? null : 'before/')), after: dirUrl(PARAMS.get('after'))};
const CHANGES = PARAMS.get('changes') || 'applied-changes.json';
const KIND = {'font-size': '字号', 'radius': '圆角', 'spacing': '间距', 'breakpoint': '断点', 'color': '颜色', 'font-weight': '字重'};
const $ = s => document.querySelector(s);
const frames = {before: $('#before'), after: $('#after')};
const store = {get(k, d){try{return localStorage.getItem('scale-preview-' + k) ?? d}catch{return d}}, set(k, v){try{localStorage.setItem('scale-preview-' + k, v)}catch{}}};
let state = {page: store.get('page', '#home'), width: +store.get('width', 1440), mode: store.get('mode', 'side'), showing: 'before', kind: '', stamp: Date.now()};
let syncing = false;

function pressed(group, attr, value){ for (const b of document.querySelectorAll(group + ' button')) b.setAttribute('aria-pressed', String(b.dataset[attr] == value)); }

function layout(){
  for (const f of Object.values(frames)){
    const box = f.parentElement.getBoundingClientRect();
    const scale = Math.min(1, box.width / state.width);
    f.style.width = state.width + 'px';
    f.style.height = Math.ceil(box.height / scale) + 'px';
    f.style.transform = `scale(${scale})`;
  }
}

function swapStyles(frame, dir){
  const doc = frame.contentDocument;
  if (!doc) return;
  const links = [...doc.querySelectorAll('link[rel="stylesheet"]')];
  let pending = 0;
  const done = () => { frame.contentWindow.dispatchEvent(new Event('resize')); frame.style.visibility = 'visible'; };
  for (const link of links){
    const m = (link.getAttribute('href') || '').match(/assets\/([\w-]+\.css)/);
    if (!m) continue;
    // A snapshot taken before nova.css existed keeps one entry file per page with that page's old load order.
    if (m[1] === 'nova.css' && /-before\/$/.test(dir)) m[1] = 'nova-' + (frame.contentWindow.location.pathname.split('/').pop().replace('.html', '') || 'index') + '.css';
    pending++;
    const next = link.cloneNode();
    next.href = dir + m[1] + '?v=' + state.stamp;
    next.onload = next.onerror = () => { link.remove(); if (--pending === 0) done(); };
    link.after(next);
  }
  if (!pending) done();
}

function wire(name){
  const frame = frames[name], other = frames[name === 'before' ? 'after' : 'before'];
  frame.addEventListener('load', () => {
    if (DIRS[name]) swapStyles(frame, DIRS[name]); else frame.style.visibility = 'visible';
    const win = frame.contentWindow, doc = frame.contentDocument;
    win.addEventListener('hashchange', () => {
      if (!$('#sync').checked || syncing) return;
      const ow = other.contentWindow;
      if (ow && ow.location.hash !== win.location.hash){ syncing = true; ow.location.hash = win.location.hash; setTimeout(() => syncing = false, 50); }
    });
    doc.addEventListener('scroll', e => {
      if (!$('#sync').checked || syncing) return;
      const od = other.contentDocument;
      if (!od) return;
      const t = e.target === doc ? od.scrollingElement : (e.target.id ? od.getElementById(e.target.id) : null);
      const src = e.target === doc ? doc.scrollingElement : e.target;
      if (!t) return;
      syncing = true; t.scrollTop = src.scrollTop; requestAnimationFrame(() => syncing = false);
    }, true);
  });
}

function load(){
  // Values are '#route' on index.html, or 'article.html' style separate pages.
  const [file, hash] = state.page.startsWith('#') ? ['index.html', state.page] : [state.page.split('#')[0], state.page.includes('#') ? '#' + state.page.split('#')[1] : ''];
  const base = new URL(file, PROTO).href + '?preview=' + state.stamp;
  for (const f of Object.values(frames)){
    let loc = null;
    try { loc = f.contentWindow.location; } catch {}
    // Same document: only the route changes, so no load event follows.
    if (loc && loc.href.split('#')[0] === base && hash){ loc.hash = hash; continue; }
    f.style.visibility = 'hidden'; f.src = base + hash;
  }
}

function setMode(mode){
  state.mode = mode; store.set('mode', mode);
  pressed('#modes', 'mode', mode);
  $('#stage').classList.toggle('flip', mode === 'flip');
  $('#flip').hidden = mode !== 'flip';
  $('#pane-before').hidden = mode === 'flip' && state.showing !== 'before';
  $('#pane-after').hidden = mode === 'flip' && state.showing !== 'after';
  requestAnimationFrame(layout);
}

function flip(){
  state.showing = state.showing === 'before' ? 'after' : 'before';
  $('#flip').textContent = `显示：${state.showing === 'before' ? '左侧' : '右侧'}（空格切换）`;
  setMode('flip');
}

let data = {summary: {}, changes: []};
function renderList(){
  const file = $('#file').value, q = $('#q').value.trim().toLowerCase();
  const rows = data.changes.filter(c => (!state.kind || c.kind === state.kind) && (!file || c.file === file) && (!q || `${c.selector} ${c.prop} ${c.old} ${c.new}`.toLowerCase().includes(q)));
  $('#list').innerHTML = rows.length ? rows.slice(0, 400).map(c => `<div class="row"><code>${esc(c.selector)}${c.media ? ' · ' + esc(c.media) : ''}</code><div class="diff"><span>${esc(c.prop)}</span><del>${esc(c.old)}</del>→<ins>${esc(c.new)}</ins></div><span class="file">${esc(c.file)} · ${KIND[c.kind] || c.kind}</span></div>`).join('') + (rows.length > 400 ? `<p class="empty">只显示前 400 条，共 ${rows.length} 条。</p>` : '') : '<p class="empty">没有匹配的变更。</p>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

fetch(CHANGES + '?v=' + state.stamp).then(r => r.json()).then(d => {
  data = d;
  const total = d.changes.length;
  $('#after-count').textContent = `共 ${total} 处变更`;
  const kinds = [['', `全部 ${total}`], ...Object.entries(d.summary).map(([k, n]) => [k, `${KIND[k] || k} ${n}`])];
  $('#summary').innerHTML = kinds.map(([k, label]) => `<button type="button" data-kind="${k}" aria-pressed="${k === state.kind}">${label}</button>`).join('');
  const files = [...new Set(d.changes.map(c => c.file))].sort();
  $('#file').insertAdjacentHTML('beforeend', files.map(f => `<option>${f}</option>`).join(''));
  renderList();
}).catch(() => { $('#list').innerHTML = '<p class="empty">无法读取 applied-changes.json。请通过本地 HTTP 服务打开此页面。</p>'; });

$('#summary').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.kind = b.dataset.kind; for (const x of $('#summary').children) x.setAttribute('aria-pressed', String(x === b)); renderList(); });
$('#file').addEventListener('change', renderList);
$('#q').addEventListener('input', renderList);
$('#page').value = state.page;
$('#page').addEventListener('change', e => { state.page = e.target.value; store.set('page', state.page); load(); });
$('#widths').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.width = +b.dataset.w; store.set('width', state.width); pressed('#widths', 'w', state.width); layout(); });
$('#modes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
$('#flip').addEventListener('click', flip);
$('#reload').addEventListener('click', () => { state.stamp = Date.now(); load(); });
$('#toggle-list').addEventListener('click', () => { const a = $('#changes'); a.hidden = !a.hidden; $('#toggle-list').setAttribute('aria-expanded', String(!a.hidden)); requestAnimationFrame(layout); });
document.addEventListener('keydown', e => { if (e.code === 'Space' && state.mode === 'flip' && !e.target.matches('input,select,textarea')){ e.preventDefault(); flip(); } });
window.addEventListener('resize', layout);

if (DIRS.after){
  document.querySelector('#pane-before .pane-label').innerHTML = '<span class="tag">当前</span>当前原型';
  document.querySelector('#pane-after .pane-label').innerHTML = '<span class="tag after">预览</span>视觉批次 <i id="after-count"></i>';
  document.querySelector('header h1').innerHTML = '视觉批次对比<small>TOKEN-PROPOSAL.md · 阴影、玻璃、填充及遗留项</small>';
  document.title = '视觉批次对比 / Nova Island 设计系统';
}
wire('before'); wire('after');
pressed('#widths', 'w', state.width);
setMode(state.mode);
load();
</script>
</body>
</html>
