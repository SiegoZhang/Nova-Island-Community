<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整页加载态预览 / Nova Island</title>
<style>html,body{margin:0;height:100%;font-family:Inter,"PingFang SC",sans-serif;background:#F7F7F9;color:#333}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #F2F2F2;background:#fff;font-size:13px}header span{margin-right:auto}button,a{border:1px solid #F2F2F2;background:#fff;color:#333;padding:9px 16px;border-radius:24px;text-decoration:none;font:inherit;cursor:pointer}button:hover,a:hover{background:#F7F7F9}iframe{display:block;width:100%;flex:1;border:0;min-height:0}</style></head>
<body><header><span>整页加载态预览</span><button id="hold">保持加载态</button><button id="replay">播放进入效果</button><button id="invite">预览导览邀请</button><a href="index.html#home">返回网站</a></header><iframe id="preview" title="导航、搜索与推荐页加载态" src="index.html?preview=full-shell#home?loading=1&amp;shell=1"></iframe>
<script>const frame=document.querySelector('#preview');document.querySelector('#hold').onclick=()=>{frame.src='index.html?preview='+Date.now()+'#home?loading=1&shell=1'};document.querySelector('#replay').onclick=()=>{frame.src='index.html?preview='+Date.now()+'#home'};document.querySelector('#invite').onclick=()=>{frame.src='index.html?preview='+Date.now()+'#home?tour=preview'};</script></body></html>
